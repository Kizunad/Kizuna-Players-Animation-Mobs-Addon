plugins {
    alias(libs.plugins.fabric.loom)
    alias(libs.plugins.protobuf)
}

group = 'dev.kizuna'
version = '0.1.0-SNAPSHOT'
// PA 的唯一协议源；目录由装配清单给出，-Pkizuna.dir.players-animation 可改指。
ext.kpaProtoDir = new File(kizunaWorkspace.directory('players-animation'), 'src/main/proto')

repositories { mavenCentral() }

dependencies {
    minecraft libs.minecraft
    mappings "net.fabricmc:yarn:${libs.versions.yarn.get()}:v2"
    modImplementation libs.fabric.loader
    modImplementation libs.fabric.api
    modImplementation 'dev.kizuna:kizuna-players-animation'
    implementation libs.protobuf.java
    include libs.protobuf.java
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(libs.versions.java.get())
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = libs.versions.java.get().toInteger()
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(libs.versions.java.get()) }
}

test { useJUnitPlatform() }

tasks.register('exportVanillaModels', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.kizuna.playeranimation.mobs.VanillaModelExport'
    args layout.buildDirectory.file('vanilla-models.json').get().asFile.path
}

sourceSets.main.proto {
    srcDirs = [kpaProtoDir]
    include 'kizuna/playeranimation/v1/entity_animation.proto'
}

protobuf {
    // 编译器与运行库固定同版。
    protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.java.get()}" }
    generateProtoTasks {
        ofSourceSet('main').configureEach { task ->
            task.generateDescriptorSet = true
            task.descriptorSetOptions.path = layout.buildDirectory.file('descriptors/entity-animation-v1.desc').get().asFile.path
            task.descriptorSetOptions.includeSourceInfo = true
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

jar { from('LICENSE') }

tasks.register('protocolZip', Zip) {
    dependsOn tasks.named('generateProto')
    archiveClassifier = 'proto'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(kpaProtoDir) { include 'kizuna/playeranimation/v1/entity_animation.proto' }
    from(layout.buildDirectory.file('descriptors/entity-animation-v1.desc')) { into 'descriptors' }
    from('LICENSE')
}

tasks.named('build') { dependsOn tasks.named('protocolZip') }

tasks.register('checkMobGeometry', Exec) {
    dependsOn tasks.named('exportVanillaModels')
    commandLine 'python3', 'scripts/test_mob_geometry.py'
}
tasks.named('check') { dependsOn tasks.named('checkMobGeometry') }

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
    clientTest {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}

loom {
    mods {
        kizuna_players_animation_mobs { sourceSet sourceSets.main }
        kpa_mobs_gametest { sourceSet sourceSets.gametest }
        kpa_mobs_client_test { sourceSet sourceSets.clientTest }
    }
    runs {
        gametest {
            server()
            source sourceSets.gametest
            runDir 'build/gametest'
            vmArg '-Dfabric-api.gametest'
            vmArg '-Dfabric-api.gametest.report-file=../gametest-results.xml'
        }
        clientTest {
            client()
            source sourceSets.clientTest
            runDir 'build/clienttest'
            programArgs '--quickPlaySingleplayer', 'animation-mob-test', '--width', '1280', '--height', '960'
            vmArg '-Dkpa.mobs.clientTest.report=../clienttest-results.txt'
        }
    }
}

tasks.register('prepareClientTestWorld', Copy) {
    dependsOn tasks.named('runGametest')
    from layout.buildDirectory.dir('gametest/world')
    into layout.buildDirectory.dir('clienttest/saves/animation-mob-test')
    exclude 'session.lock'
}
tasks.named('runClientTest') {
    dependsOn tasks.named('prepareClientTestWorld')
    def report = layout.buildDirectory.file('clienttest-results.txt')
    doFirst { report.get().asFile.text = 'success=false\n' }
    doLast {
        if (!report.get().asFile.text.startsWith('success=true')) {
            throw new GradleException("客户端验收失败，查看 ${report.get().asFile}")
        }
    }
}

// 开发验收包含真实 Meridian 类人施放链；正式附属仍只依赖 PA 的公开字节入口。
apply from: new File(kizunaWorkspace.directory('framework'), 'scripts/full-assembly.gradle')
dependencies {
    // 本仓没有 Framework 源码依赖，开发装配显式补齐两个非 Fabric 基础库。
    localRuntime libs.tomlj
    localRuntime files(kizunaWorkspace.artifact('framework', 'server', false))
    localRuntime files(kizunaWorkspace.artifact('framework', 'client', false))
    localRuntime files(kizunaWorkspace.artifact('human', 'client', false))
}
